<svg xmlns="http://www.w3.org/2000/svg" width="935" height="3005" viewBox="0 0 935 3005">
  <defs>
    <radialGradient id="background" cx="50%" cy="0%" r="78%">
      <stop offset="0" stop-color="#13203a"/><stop offset=".7" stop-color="#05070d"/><stop offset="1" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="heroLine" x1="0" x2="1"><stop stop-color="#74b9ff" stop-opacity="0"/><stop offset=".5" stop-color="#74b9ff"/><stop offset="1" stop-color="#74b9ff" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#fff" stroke-opacity=".03"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="particlesA" width="467" height="605" patternUnits="userSpaceOnUse">
      <g fill="#f7d35c" filter="url(#glow)">
        <circle cx="82" cy="76" r="1.2" opacity=".35"><animate attributeName="opacity" values=".18;.8;.18" dur="7.2s" begin="-1.3s" repeatCount="indefinite"/><animate attributeName="r" values="1.2;1.7;1.2" dur="7.2s" begin="-1.3s" repeatCount="indefinite"/></circle>
        <circle cx="194" cy="206" r="2.7" opacity=".9"><animate attributeName="opacity" values=".3;1;.3" dur="9.4s" begin="-5.1s" repeatCount="indefinite"/><animate attributeName="r" values="2.2;3;2.2" dur="9.4s" begin="-5.1s" repeatCount="indefinite"/></circle>
        <circle cx="316" cy="122" r="1.6" opacity=".55"><animate attributeName="opacity" values=".22;.9;.22" dur="6.3s" begin="-3.8s" repeatCount="indefinite"/></circle>
        <circle cx="408" cy="336" r="2.2" opacity=".75"><animate attributeName="opacity" values=".25;1;.25" dur="10.8s" begin="-7.2s" repeatCount="indefinite"/><animate attributeName="r" values="1.8;2.6;1.8" dur="10.8s" begin="-7.2s" repeatCount="indefinite"/></circle>
        <circle cx="142" cy="510" r="1" opacity=".3"><animate attributeName="opacity" values=".12;.7;.12" dur="5.6s" begin="-2.4s" repeatCount="indefinite"/></circle>
      </g>
    </pattern>
