      </g>
    </pattern>
    <clipPath id="typePhraseOne"><rect x="330" y="522" width="0" height="48"><animate attributeName="width" values="0;290;290;0;0" keyTimes="0;.25;.40;.48;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="typePhraseTwo"><rect x="310" y="522" width="0" height="48"><animate attributeName="width" values="0;0;330;330;0" keyTimes="0;.52;.78;.94;1" dur="10s" repeatCount="indefinite"/></rect></clipPath>
