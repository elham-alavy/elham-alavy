    <rect x="310" y="528" width="2" height="34" fill="#f7d35c"><animate attributeName="x" values="310;310;640;640;310" keyTimes="0;.52;.78;.94;1" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.51;.52;.98;1" dur="10s" repeatCount="indefinite"/></rect>
  </g>
  <rect x="367" y="640" width="200" height="2" fill="url(#heroLine)"/>

  <g transform="translate(0 -800)">
