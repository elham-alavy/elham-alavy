        <circle cx="54" cy="308" r="2.1" opacity=".7"><animate attributeName="opacity" values=".2;1;.2" dur="8.6s" begin="-4.6s" repeatCount="indefinite"/><animate attributeName="r" values="1.7;2.5;1.7" dur="8.6s" begin="-4.6s" repeatCount="indefinite"/></circle>
        <circle cx="288" cy="88" r="1.1" opacity=".35"><animate attributeName="opacity" values=".15;.75;.15" dur="11.2s" begin="-8.7s" repeatCount="indefinite"/></circle>
        <circle cx="472" cy="454" r="2.8" opacity=".9"><animate attributeName="opacity" values=".3;1;.3" dur="7.8s" begin="-6.1s" repeatCount="indefinite"/><animate attributeName="r" values="2.3;3.2;2.3" dur="7.8s" begin="-6.1s" repeatCount="indefinite"/></circle>
