    <g><rect x="27" y="2082" width="428" height="267" rx="18" fill="#0c121e" fill-opacity=".84" stroke="#22344d"/><text x="55" y="2125" fill="#f7d35c" font-size="14" letter-spacing="2">HEATTWIN</text><text x="55" y="2171" fill="#eef4fb" font-size="22" font-weight="700">Open Digital Twin Platform</text><text x="55" y="2214" fill="#eef4fb" font-size="18">Building intelligence platform.</text><text x="55" y="2260" fill="#eef4fb" font-size="16" font-weight="700">Contribution</text><text x="55" y="2289" fill="#eef4fb" font-size="17"><tspan x="55">Platform Architecture · Research &amp;</tspan><tspan x="55" dy="23">Development</tspan></text></g>
    <g><rect x="480" y="2082" width="428" height="267" rx="18" fill="#0c121e" fill-opacity=".84" stroke="#22344d"/><text x="508" y="2125" fill="#f7d35c" font-size="14" letter-spacing="2">COURSE DEVELOPMENT (CAPLA)</text><text x="508" y="2171" fill="#eef4fb" font-size="22" font-weight="700"><tspan x="508">Reasoning-Based Learning</tspan><tspan x="508" dy="25">Platform</tspan></text><text x="508" y="2240" fill="#eef4fb" font-size="17"><tspan x="508">Reasoning-based educational design for</tspan><tspan x="508" dy="22">undergraduate and graduate students.</tspan></text><text x="508" y="2298" fill="#eef4fb" font-size="16" font-weight="700">Contribution</text><text x="508" y="2327" fill="#eef4fb" font-size="17">Course Designer</text></g>

    <g><rect x="27" y="2375" width="428" height="267" rx="18" fill="#0c121e" fill-opacity=".84" stroke="#22344d"/><text x="55" y="2418" fill="#f7d35c" font-size="14" letter-spacing="2">BECOMING BIOMASS</text><text x="55" y="2464" fill="#eef4fb" font-size="22" font-weight="700">RVTR Research Collaboration</text><text x="55" y="2507" fill="#eef4fb" font-size="18">Biomass and material futures.</text><text x="55" y="2553" fill="#eef4fb" font-size="16" font-weight="700">Contribution</text><text x="55" y="2582" fill="#eef4fb" font-size="17">Energy Simulator</text></g>
    <g><rect x="480" y="2375" width="428" height="267" rx="18" fill="#0c121e" fill-opacity=".84" stroke="#22344d"/><text x="508" y="2418" fill="#f7d35c" font-size="14" letter-spacing="2">HEAT, HEALTH &amp; HRI USING BHS</text><text x="508" y="2464" fill="#eef4fb" font-size="22" font-weight="700">Building Heat Stress Analytics</text><text x="508" y="2507" fill="#eef4fb" font-size="18">Heat, health and environmental analytics.</text><text x="508" y="2553" fill="#eef4fb" font-size="16" font-weight="700">Contribution</text><text x="508" y="2582" fill="#eef4fb" font-size="17">Platform Architecture &amp; Pipeline Designer</text></g>

    <g><rect x="27" y="2668" width="428" height="247" rx="18" fill="#0c121e" fill-opacity=".84" stroke="#22344d"/><text x="55" y="2711" fill="#f7d35c" font-size="13" letter-spacing="1.5">TUSD SOLAR SUITABILITY ANALYSIS (JWJ)</text><text x="55" y="2757" fill="#eef4fb" font-size="22" font-weight="700">Rooftop PV Decision Support</text><text x="55" y="2800" fill="#eef4fb" font-size="18">Solar suitability and financial analysis.</text><text x="55" y="2846" fill="#eef4fb" font-size="16" font-weight="700">Contribution</text><text x="55" y="2875" fill="#eef4fb" font-size="17">Energy Analyst</text></g>
    <g><rect x="480" y="2668" width="428" height="247" rx="18" fill="#0c121e" fill-opacity=".84" stroke="#22344d"/><text x="508" y="2711" fill="#f7d35c" font-size="14" letter-spacing="2">ELECTRIFICATION AT ARIZONA (SRP)</text><text x="508" y="2757" fill="#eef4fb" font-size="21" font-weight="700"><tspan x="508">Building Electrification &amp; Energy</tspan><tspan x="508" dy="25">Transition</tspan></text><text x="508" y="2825" fill="#eef4fb" font-size="18">Energy transition planning.</text><text x="508" y="2871" fill="#eef4fb" font-size="16" font-weight="700">Contribution</text><text x="508" y="2900" fill="#eef4fb" font-size="17">Energy Systems Analyst</text></g>
  </g>

